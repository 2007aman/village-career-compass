<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - Village Career Compass</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
</head>
<body class="bg-slate-950 text-gray-100 min-h-screen flex flex-col">
    <script src="navbar.js"></script>
    <custom-navbar></custom-navbar>

    <section class="py-14 px-6 bg-gradient-to-br from-orange-500/10 to-yellow-500/10">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl md:text-5xl font-bold gradient-text mb-4">Welcome Back</h1>
            <p class="text-lg text-gray-300 max-w-xl mx-auto">Log in to continue your career journey.</p>
        </div>
    </section>

    <section class="py-12 px-6 flex-grow">
        <div class="container mx-auto max-w-md">
            <div class="glass-card p-8 rounded-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-orange-500 to-yellow-500"></div>

                <form id="loginForm" class="space-y-5 mt-4" novalidate>
                    <div id="formMessage" class="hidden rounded-lg px-4 py-3 text-sm" role="alert"></div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2" for="email">Email Address</label>
                        <input type="email" id="email" required autocomplete="email" class="form-input" placeholder="your.email@example.com">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2" for="password">Password</label>
                        <div class="relative">
                            <input type="password" id="password" required autocomplete="current-password" class="form-input pr-12" placeholder="Your password">
                            <button type="button" data-toggle-password="password" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-semibold text-orange-400 hover:text-amber-300">Show</button>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="gradient-btn w-full px-6 py-3 rounded-lg font-semibold">Log In</button>
                </form>

                <p class="text-center text-sm text-gray-400 mt-6">
                    New here? <a href="signup.html" id="otherLink" class="text-orange-400 font-semibold hover:text-amber-300">Create an account</a>
                </p>
            </div>
        </div>
    </section>

    <script src="footer.js"></script>
    <custom-footer></custom-footer>
    <script src="auth.js"></script>
</body>
</html>
